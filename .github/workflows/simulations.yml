# Runs the scenarios in scenarios.yaml against your agent on LiveKit Cloud.
# Simulations spend real inference, so this only runs on demand (Actions tab, "Run
# workflow"), and it needs LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET as repo
# secrets. Run
# `lk agent simulate text --scenarios scenarios.yaml` locally while iterating.
name: Simulations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: UV_GIT_LFS=1 uv sync

    - name: Download model files
      run: uv run python src/agent.py download-files

    - name: Install LiveKit CLI
      run: curl -sSL https://get.livekit.io/cli | bash

    - name: Run simulations
      run: lk agent simulate text --scenarios scenarios.yaml
